# Speaker protection for the OnePlus Pad 3 internal speakers.
#
# The stock firmware protects the six aw88261 driven speakers with a DSP
# excursion and voice coil temperature model that is not available here.
# This sink replaces it with a conservative static stage, so the amplifiers
# can run at the stock level (-2.5 dB):
#   4th order high pass at 180 Hz, removing content the small drivers cannot
#   reproduce but which costs the most excursion,
#   lookahead brick wall limiter at -3 dBFS, so no full scale peaks reach
#   the amplifiers.
# All user volume is applied in front of this stage. The hardware sink
# behind it is kept at unity by erhai-speaker-unity.service.
# Runs in the filter-chain.service PipeWire instance.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers"
      media.name = "Speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = hpl1 label = bq_highpass control = { "Freq" = 180.0 "Q" = 0.541 } }
          { type = builtin name = hpl2 label = bq_highpass control = { "Freq" = 180.0 "Q" = 1.307 } }
          { type = builtin name = hpr1 label = bq_highpass control = { "Freq" = 180.0 "Q" = 0.541 } }
          { type = builtin name = hpr2 label = bq_highpass control = { "Freq" = 180.0 "Q" = 1.307 } }
          { type = ladspa name = lim plugin = "/usr/lib/ladspa/lsp-plugins-ladspa.so"
            label = "http://lsp-plug.in/plugins/ladspa/limiter_stereo"
            control = {
              "Threshold (G)" = 0.708
              "Gain boost" = 0
              "Lookahead (ms)" = 5.0
              "Attack time (ms)" = 2.0
              "Release time (ms)" = 10.0
              "Automatic level regulation" = 1
            }
          }
        ]
        links = [
          { output = "hpl1:Out" input = "hpl2:In" }
          { output = "hpr1:Out" input = "hpr2:In" }
          { output = "hpl2:Out" input = "lim:Input L" }
          { output = "hpr2:Out" input = "lim:Input R" }
        ]
        inputs = [ "hpl1:In" "hpr1:In" ]
        outputs = [ "lim:Output L" "lim:Output R" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name = "erhai.speaker"
        media.class = Audio/Sink
        priority.session = 2000
        priority.driver = 2000
        device.icon-name = "audio-speakers"
      }
      playback.props = {
        node.name = "erhai.speaker.output"
        node.passive = true
        target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
        node.dont-fallback = true
        stream.dont-remix = true
      }
    }
  }
]
