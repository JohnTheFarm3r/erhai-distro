# Cameras are offered through libcamera. Hide the raw CAMSS capture nodes
# and the Iris codec, which are not cameras.
monitor.v4l2.rules = [
  {
    matches = [
      { device.product.name = "Qualcomm Camera Subsystem" }
      { device.product.name = "~Iris.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
