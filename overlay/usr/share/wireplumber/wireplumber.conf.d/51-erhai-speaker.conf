# The raw speaker sink is only fed by the protected "Speakers" sink.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.description = "Speakers (unprotected)"
        priority.session = 100
        priority.driver = 100
        channelmix.max-volume = 1.0
      }
    }
  }
]

# Connected outputs become the default; the raw speakers never do.
wireplumber.components = [
  {
    name = erhai/default-output.lua, type = script/lua
    provides = custom.erhai-default-output
    after = [ policy.default-nodes ]
  }
]
wireplumber.profiles = {
  main = {
    custom.erhai-default-output = required
  }
}
