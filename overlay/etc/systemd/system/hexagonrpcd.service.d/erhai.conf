# The sensor core runs on the ADSP, whose FastRPC channel is a secure domain
# on this tablet: serve its sensorspd protection domain from the start of the
# session, with the sensor registry writable. The server stops for suspend;
# erhai-sensorspd-resume.service starts it again. The registry is copied from
# the tablet on the first boot (erhai-sensor-registry.service).
[Unit]
ConditionPathExists=/dev/fastrpc-adsp-secure
After=
Wants=erhai-sensor-registry.service
After=erhai-sensor-registry.service
Conflicts=suspend.target
Before=suspend.target

[Service]
ExecStart=
ExecStart=/usr/libexec/hexagonrpc/hexagonrpcd -f /dev/fastrpc-adsp-secure -d adsp -s
ReadWritePaths=/var/lib/hexagonrpcd
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
